<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人说明书 · 外婆的收音机</title>
  <meta name="description" content="慢慢转动旋钮，寻找藏在夜空里的电台。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
  <div class="crt-overlay"></div>
  <div class="starfield" id="starfield"></div>

  <main class="content-area" id="content-area">
    <div class="content-inner" id="content-inner"></div>
  </main>

  <footer class="radio-bar" id="radio-bar">
    <div class="power-mask" id="power-mask">
      <div class="power-box">
        <p class="power-title">外婆的收音机</p>
        <p class="power-sub">FM · 多频道像素电台</p>
        <button class="power-btn" id="power-btn">▶ 开机</button>
        <p class="power-hint">建议戴上耳机 · 慢慢转动旋钮</p>
      </div>
    </div>

    <div class="radio-body">
      <div class="speaker-grille">
        <div class="speaker-lines"></div>
      </div>

      <div class="radio-center">
        <div class="freq-scale" id="freq-scale">
          <div class="freq-ticks" id="freq-ticks"></div>
          <div class="freq-stations" id="freq-stations"></div>
          <div class="freq-indicator" id="freq-indicator">
            <div class="indicator-line"></div>
            <div class="indicator-handle"></div>
          </div>
        </div>

        <div class="radio-controls">
          <button class="ctrl-btn" id="btn-prev" title="上一个电台">◀</button>
          <div class="knob-round" id="knob-round">
            <div class="knob-mark"></div>
          </div>
          <button class="ctrl-btn" id="btn-next" title="下一个电台">▶</button>
          <div class="hint-text" id="hint-text">沙沙沙…… 慢慢转动旋钮，寻找藏在夜空里的电台</div>
        </div>
      </div>

      <div class="radio-right">
        <div class="digital-display">
          <span class="digital-freq" id="digital-freq">88.1</span>
          <span class="digital-mhz">MHz</span>
        </div>
        <div class="signal-bars" id="signal-bars">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span>
          <span class="bar"></span><span class="bar"></span>
        </div>
        <div class="station-name" id="station-name">身份台</div>
      </div>
    </div>
  </footer>

  <script src="js/data.js?v=12"></script>
  <script src="js/audio.js?v=12"></script>
  <script src="js/radio.js?v=12"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人说明书 · 多频道像素电台</title>
  <meta name="description" content="一台多频道像素电台，调频到不同频率，听见不同的我。">

  <!-- 像素字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <!-- Tone.js -->
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- CRT 扫描线遮罩 -->
  <div class="crt-overlay"></div>
  <div class="crt-flicker"></div>

  <!-- 星空背景 -->
  <div class="starfield" id="starfield"></div>

  <!-- 主容器 -->
  <main class="app" id="app">

    <!-- ===== 开机界面 ===== -->
    <section class="boot-screen" id="boot-screen">
      <div class="boot-radio">
        <div class="boot-antena"></div>
        <div class="boot-body">
          <div class="boot-screen-display">
            <p class="boot-title">PERSONAL RADIO</p>
            <p class="boot-sub">多频道像素电台</p>
            <p class="boot-blink">▶ PRESS START</p>
          </div>
          <div class="boot-speaker"></div>
        </div>
      </div>
      <p class="boot-hint">建议戴上耳机 · 音量适中</p>
      <button class="pixel-btn boot-btn" id="power-btn">ON AIR</button>
    </section>

    <!-- ===== 电台主体 ===== -->
    <section class="radio-stage" id="radio-stage" style="display:none">

      <!-- 电台外壳 -->
      <div class="radio-unit">

        <!-- 天线 -->
        <div class="antena">
          <div class="antena-line"></div>
          <div class="antena-tip"></div>
        </div>

        <!-- 顶部品牌栏 -->
        <div class="radio-topbar">
          <span class="brand">PERSONAL FM</span>
          <span class="model">MODEL PX-2026</span>
        </div>

        <!-- 主体网格 -->
        <div class="radio-main">

          <!-- 左侧：LCD 屏幕 -->
          <div class="lcd-panel" id="lcd-panel">
            <div class="lcd-screen">
              <div class="lcd-top">
                <span class="lcd-freq" id="lcd-freq">88.1</span>
                <span class="lcd-mhz">MHz</span>
              </div>
              <div class="lcd-channel" id="lcd-channel">身份台</div>
              <canvas id="wave-canvas" width="280" height="60"></canvas>
              <div class="lcd-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="lcd-status-text">ON AIR</span>
              </div>
            </div>
          </div>

          <!-- 右侧：控制区 -->
          <div class="controls">

            <!-- 频道指示灯 -->
            <div class="led-row" id="led-row">
              <button class="led-btn active" data-channel="0" title="FM 88.1 身份台">
                <span class="led"></span>
                <span class="led-label">88.1</span>
              </button>
              <button class="led-btn" data-channel="1" title="FM 92.5 现在进行台">
                <span class="led"></span>
                <span class="led-label">92.5</span>
              </button>
              <button class="led-btn" data-channel="2" title="FM 96.8 未来台">
                <span class="led"></span>
                <span class="led-label">96.8</span>
              </button>
              <button class="led-btn" data-channel="3" title="FM 101.3 联络台">
                <span class="led"></span>
                <span class="led-label">101.3</span>
              </button>
              <button class="led-btn" data-channel="4" title="FM 105.7 成果台">
                <span class="led"></span>
                <span class="led-label">105.7</span>
              </button>
            </div>

            <!-- 调频旋钮 -->
            <div class="tuner">
              <button class="knob-btn knob-prev" id="knob-prev" aria-label="上一个频道">
                <span class="arrow">◀</span>
              </button>
              <div class="knob" id="knob">
                <div class="knob-inner">
                  <div class="knob-marker"></div>
                </div>
              </div>
              <button class="knob-btn knob-next" id="knob-next" aria-label="下一个频道">
                <span class="arrow">▶</span>
              </button>
            </div>

            <!-- 音量 -->
            <div class="volume-control">
              <span class="vol-icon">♪</span>
              <input type="range" id="volume" class="pixel-slider" min="0" max="100" value="60">
              <span class="vol-icon">♫</span>
            </div>

            <!-- 电源 -->
            <button class="pixel-btn power-off" id="power-off">OFF</button>
          </div>
        </div>

        <!-- 喇叭网 -->
        <div class="radio-speaker">
          <div class="speaker-grid"></div>
        </div>
      </div>

      <!-- ===== 内容展示区 ===== -->
      <div class="content-panel" id="content-panel">
        <div class="content-header">
          <span class="content-freq" id="content-freq">FM 88.1</span>
          <span class="content-title" id="content-title">身份台 · 我是谁</span>
        </div>
        <div class="content-body" id="content-body">
          <!-- 内容由 JS 动态渲染 -->
        </div>
      </div>

    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/radio.js"></script>
</body>
</html>
